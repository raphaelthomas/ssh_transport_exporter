version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /tests/e2e/*
    schedule:
      interval: daily
    groups:
      e2e-images:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /tests/e2e/asyncssh
    schedule:
      interval: daily
    groups:
      e2e-python:
        patterns:
          - "*"
