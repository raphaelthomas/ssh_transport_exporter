version: "2"

run:
  build-tags: [e2e]

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      enabled-checks:
        - deferInLoop
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    rules:
      # Tests dial with deliberately weak settings (InsecureIgnoreHostKey) and
      # do unchecked integer conversions on table data. Production code is
      # linted normally.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
