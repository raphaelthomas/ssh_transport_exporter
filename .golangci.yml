version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - predeclared
    - revive
    - sloglint
    - unconvert
    - unparam
    - usetesting
    - wastedassign

  settings:
    gocritic:
      enabled-checks:
        - deferInLoop

  exclusions:
    rules:
      # Tests dial with deliberately weak settings (InsecureIgnoreHostKey) and
      # do unchecked integer conversions on table data. Production code is
      # linted normally.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
