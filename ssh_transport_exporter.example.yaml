# Default known_hosts file for all modules
known_hosts_file: /etc/ssh/ssh_known_hosts
# Default allow-list of probe targets, inherited by modules that set none.
# Forms: exact hostname, "*.sub.example.com" (exactly one left label),
# IPv4/IPv6 literal, or CIDR. A nil or empty list denies all targets. Matching
# is literal on the caller-sent target with no DNS resolution: hostname
# patterns match only hostname targets, IP/CIDR only IP targets.
allowed_targets:
  - "*.example.com"
  - bastion.example.com
  - 10.0.0.0/8
  - 2001:db8::/32
# Default set of ports a module is permitted to probe. Defaults to target_port.
# Must contain target_port.
allowed_ports:
  - 22
  - 2222
# Default port to probe targets on, if no port has been provided
target_port: 22
# Named modules containing a specific probe configuration
modules:
  # Module named "default". Used when no module is explicitly specified in a
  # request to the exporters /probe endpoint
  default:
    # known_hosts file to verify a probe target's identity against. Overrides
    # the globally set default known_hosts file.
    known_hosts_file: /etc/ssh/other_ssh_known_hosts
    # This module overrides the inherited list with its own.
    allowed_targets:
      - "*.prod.example.com"
    # Ports this module is permitted to probe. Overrides the globally set
    # default allowed_ports. Must contain target_port (2222 below).
    allowed_ports:
      - 2222
      - 8022
    # Port to probe a target on, if the port was not specified in the supplied
    # target. Overrides the globally set default target_port.
    target_port: 2222
    # Specify the advertised ciphers and their order used in the key exchange
    # phase.
    ciphers:
      - chacha20-poly1305@openssh.com
      - aes128-ctr
      - aes192-ctr
      - aes256-ctr
      - aes128-gcm@openssh.com
      - aes256-gcm@openssh.com
    # Specify the advertised host key algorithms and their order used to verify
    # the target's identity.
    host_key_algorithms:
      - ssh-ed25519-cert-v01@openssh.com
      - ecdsa-sha2-nistp256-cert-v01@openssh.com
      - ecdsa-sha2-nistp384-cert-v01@openssh.com
      - ecdsa-sha2-nistp521-cert-v01@openssh.com
      - sk-ssh-ed25519-cert-v01@openssh.com
      - sk-ecdsa-sha2-nistp256-cert-v01@openssh.com
      - rsa-sha2-512-cert-v01@openssh.com
      - rsa-sha2-256-cert-v01@openssh.com
      - ssh-ed25519
      - ecdsa-sha2-nistp256
      - ecdsa-sha2-nistp384
      - ecdsa-sha2-nistp521
      - sk-ssh-ed25519@openssh.com
      - sk-ecdsa-sha2-nistp256@openssh.com
      - rsa-sha2-512
      - rsa-sha2-256
  # Module named "weak_audit". Advertises ONLY the insecure ciphers and host key
  # algorithms x/crypto/ssh still supports. Because these are never negotiated
  # by default, a successful probe with this module means the target agreed to a
  # weak algorithm: probe SUCCESS flags a problematic host, and probe FAILURE
  # (no mutual algorithm) means the target correctly refused all weak options (or is offline).
  weak_audit:
    ciphers:
      - arcfour        # RC4, no keystream discard (weakest)
      - arcfour128     # RC4
      - arcfour256     # RC4
      - 3des-cbc       # 64-bit block cipher, CBC
      - aes128-cbc     # CBC mode (vulnerable to padding-oracle attacks)
    host_key_algorithms:
      - ssh-dss-cert-v01@openssh.com   # DSA, insecure key sizes
      - ssh-dss                        # DSA, insecure key sizes
      - ssh-rsa-cert-v01@openssh.com   # SHA-1 signature
      - ssh-rsa                        # SHA-1 signature
